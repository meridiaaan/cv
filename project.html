  var PROJECTS = [{"s":"reformirovanie-otdela-pm","t":"Реформирование отдела ПМ","x":"Разобрала причины текучки 12 менеджеров за год: экзит-интервью, 1:1 с сотрудниками и руководителем, оценка 360. Пересмотрела портрет кандидата, критерии найма и онбординг.","g":"Менеджмент","c":"Braind","r":"январь 2024 — сейчас","role":"HR-партнёр проекта","body":[{"h":"Задача","p":"Собрать стабильную команду менеджеров проектов, которая справляется с задачами, разделяет ценности компании и эффективно взаимодействует с командой и заказчиком."},{"h":"Контекст","p":"Отдел проектного управления в кризисе: высокая текучесть, перегруз, разный подход к найму и адаптации, сложные отношения внутри команды."},{"h":"Что сделала","li":["Провела интервью со всеми действующими PM и разобрала выходные интервью: перегруз, слабые процессы, выгорание","Вместе с руководителем отдела выявила разрыв между ожиданиями и реальностью","Собрала с Head of PMO и генеральным директором обновлённый портрет кандидата и красные флаги","Пересмотрела воронку подбора и фильтры по мотивации, проверила способность работать в темпе агентства","Ввела ежемесячные 1:1 с PM: мотивация, состояние, отношения с руководителем, с логированием и обсуждением с руководителем","Собрала двухнедельный онбординг PM"]},{"h":"Результат","li":["В команде появились стабильные PM под текущую модель агентства","Уровень уверенности у «старых» менеджеров вырос, работа стала приносить больше удовлетворения","Руководитель пересмотрел стиль управления и стал внимательнее к подбору и развитию","Онбординг снизил число критических ошибок в первые месяцы","Отдел стал инициатором изменений в компании: компетенции, грейды, реформа найма"]}]},{"s":"process-nayma-s-nulya","t":"Процесс найма с нуля","x":"Заявка, оценка, аналитика воронки. Руководители понимают процесс и участвуют в нём по единым стандартам.","g":"Процессы","c":"Braind","r":"январь 2024 — сейчас","role":"автор процесса","body":[{"h":"Контекст","p":"До реформы найм шёл хаотично: отделы решали, когда им «кажется», что нужен человек, потребность не согласовывалась с дирекцией, а вакансии отменялись в процессе поиска. Описанных ролей и ожиданий не было."},{"h":"Цель","p":"Сделать найм регламентированным и предсказуемым: понятно, зачем нанимаем, кого ищем и кто за что отвечает."},{"h":"Что внедрила","li":["Описала полный процесс найма в базе знаний и провела презентацию для руководителей","Ввела этап согласования потребности: цель, приоритет, задачи и зона ответственности — без этого HR не берёт заявку","Собрала форму: профиль компетенций с уровнями, вопросы для оценки, ожидаемые ответы, план интервью","Сделала оффер из двух блоков: обязанности и ожидания на испытательный срок с критериями"]},{"h":"Результат","li":["Процесс стал обязательным стандартом для всех отделов: дизайн, маркетинг, техотделы, менеджмент","Срок выхода первого релевантного кандидата на встречу с менеджером сократился с двух недель до 3–5 дней","Заявки «найди кого-нибудь» исчезли: у всех есть профиль и план найма","Выше конверсия кандидатов, меньше холостого трафика","Оценка на испытательном сроке упростилась за счёт заранее определённых целей"]},{"h":"Кейс: frontend","p":"Позицию закрыли меньше чем за месяц. Приоритет — способность работать в агентской среде и расти, а не конкретный стек. Вместо тестового — открытые вопросы с заранее описанными ответами «плохо / приемлемо / отлично»: решение о техническом интервью занимало минуты."}]},{"s":"individualnye-soglasheniya","t":"Индивидуальные соглашения","x":"Концепция, шаблоны и запуск процесса, при котором ожидания по развитию и зарплате зафиксированы и обязательны к выполнению обеими сторонами.","g":"Удержание","c":"Braind","r":"январь 2024 — сейчас"},{"s":"ocenka-360","t":"Оценка 360","x":"Оценка 360 по всем отделам: вопросы под роль и отдел, кастомные шкалы и файл обратной связи для сотрудника.","g":"Оценка","c":"Braind","r":"январь 2024 — сейчас","role":"куратор процесса","body":[{"h":"Задача","p":"Оценить поведение и качество работы сотрудника глазами коллег и тимлидов, которые напрямую влияют на его эффективность."},{"h":"Что сделала","li":["Курировала разработку грейдов и карт компетенций, на основе которых строились вопросы со степенями выраженности","Подготовила и согласовала вопросы по каждому отделу и роли: линейный сотрудник и лид","Запустила оценку по всем сотрудникам, собрала кастомные вопросы и шкалу 0–3","Собрала два файла с результатами: таблицу ответов и баллов от коллег плюс селф-ревью","Сделала файл обратной связи для сотрудника: средние оценки по блоку, саммари ответов, замечания и сравнение с селф-ревью"]},{"h":"Результат","li":["Оценка охватила все отделы и роли","У сотрудника на руках разбор, а не только цифра","Сравнение с селф-ревью дало материал для разговора о развитии"]}]},{"s":"attestaciya-po-processam","t":"Аттестация по процессам","x":"Онлайн-аттестация по внутренним процессам: кейсы, разбор ошибок и отчёты для руководителей. Встроена в онбординг.","g":"Онбординг","c":"Braind","r":"март — май 2024","role":"инициатор, автор, координатор","body":[{"h":"Задача","p":"Найти пробелы в знании внутренних процессов и убрать операционные ошибки, которые тормозили HR-процессы и мешали командам на проектах."},{"h":"Контекст","p":"Сотрудники регулярно нарушали или игнорировали ключевые процессы: неправильно оформляли day off, не читали рабочую почту, не принимали календари и встречи, путали рабочие термины."},{"h":"Что сделала","li":["Провела аудит ключевых процессов вместе с директором по производству и собрала типовые ошибки","Собрала структуру онлайн-аттестации: кейсы на практическое применение, теоретические вопросы, встроенные комментарии к ответам и неформальный тон, чтобы снизить тревожность","Согласовала содержание с руководством и подготовила руководителей отделов к запуску","Организовала прохождение через руководителей и собрала отчёты по результатам","Провела митап с разбором результатов и ответами на вопросы"]},{"h":"Результат","li":["Прошли все 36 сотрудников — 100% на тот момент","Типовые ошибки в ключевых процессах нашлись у большинства участников; руководители получили конкретные зоны доработки внутри своих команд","Аттестация встроена в онбординг: новые сотрудники проходят её после двух недель работы","Обновила документацию по процессам с учётом самых частых ошибок"]}]},{"s":"hr-daydzhest","t":"HR-дайджест","x":"С февраля 2024, больше 20 выпусков. Единое информационное поле: проекты, изменения, достижения, процессы.","g":"Коммуникации","c":"Braind","r":"февраль 2024 — сейчас","role":"автор и редактор","body":[{"h":"Задача","p":"Создать единое информационное поле: прозрачность и общий контекст об успехах, инновациях и планах компании."},{"h":"Что сделала","li":["Запустила дайджест в феврале 2024 года в корпоративной базе знаний","Собрала формат: проекты, ключевые изменения в отделах, внедрение и изменение процессов, достижения","Веду выпуски: на момент написания — 22 выпуска и готовится новогодний с итогами года"]},{"h":"Результат","li":["Сотрудники видят общую картину, а не только свою команду","Ключевые вехи компании зафиксированы, к ним можно вернуться"]}]},{"s":"rekrutment-junior-lead","t":"Рекрутмент: junior → lead","x":"Разработка, управление проектами, маркетинг, тестирование. Весь процесс в Huntflow: заявка, поиск, интервью, оффер, выход, ИС. До 20 интервью в неделю в пики.","g":"Найм","c":"Braind","r":"январь 2024 — сейчас"},{"s":"vstrechi-1-1","t":"Встречи 1:1 как процесс","x":"Стандартизировала 1:1: регламент, темы, логирование результатов и участие HR. Обратная связь перестала зависеть от подхода руководителя и стала основой решений по развитию и удержанию.","g":"Коммуникации","c":"Braind","r":"январь 2024 — сейчас","role":"автор и куратор процесса","body":[{"h":"Ситуация","p":"Формат 1:1 в компании был, но без стандарта: руководители подходили по-разному, темы варьировались, HR не участвовали, результаты не логировались. Обратная связь не фиксировалась, выводы не приводили к системным изменениям."},{"h":"Проблематика","li":["Руководители: нет регулярной обратной связи, субъективный подход к развитию, слабое понимание вовлечённости","HR: нет информации о том, что происходит внутри команд, невозможно вовремя реагировать на тревожные сигналы","Компания: единой структуры нет, сотрудники демотивированы, риск культуры замалчивания"]},{"h":"Что сделала","li":["Разделила форматы: HR ведёт ежемесячные 1:1 про состояние, потребности и атмосферу; руководители — перформанс-ревью про результаты, цели и блокеры","Сделала встречи с HR безопасным пространством без руководителей","Ввела централизованное логирование: карточки сотрудников с итогами встреч, трекингом изменений и фидбеками","Запустила «встречи по людям»: раз в месяц HR-день с каждым руководителем — саммари 1:1, red flags, управленческие решения","Сократила формат таких встреч с двух часов до 20–40 минут на отдел"]},{"h":"Результат","li":["Нулевая текучка с IV квартала 2024 по III квартал 2025","Сотрудники сами поднимают темы и предлагают улучшения","Управленческие решения опираются на данные 1:1, директор по производству участвует в HR-днях","Процесс охватывает всё производство, отказов от участия нет"]}]},{"s":"kompetencii-i-greydy","t":"Компетенции и грейды","x":"Единая модель компетенций и грейдов вместо разрозненных подходов отделов: критерии оценки, роста и пересмотра вознаграждения.","g":"Оценка","c":"Braind","r":"январь 2024 — сейчас","role":"веду проект","body":[{"h":"Задача","p":"Свести разрозненные подходы отделов к единой модели компетенций и грейдов: критерии оценки, роста и пересмотра вознаграждения."},{"h":"Что делаю","li":["Собираю карты компетенций по ролям","Связываю грейды с оценкой 360 и наймом: профиль компетенций уже используется в заявке на вакансию","Синхронизирую отделы: единый взгляд на проект, хранение знаний и доступ к материалам"]},{"h":"Связь с ЦКП","p":"ЦКП задаёт обязанности, обязанности — компетенции. На этой основе собираются карты компетенций и грейды, а профиль компетенций используется в заявке на вакансию и в оценке 360."}]},{"s":"ckp-otdela-pm","t":"Внедрение ЦКП","x":"Курировала внедрение ЦКП в отделе: зачем нужен ценный конечный продукт, как он должен выглядеть и как на его основе строить компетенции и грейды.","g":"Процессы","c":"Braind","r":"январь 2024 — сейчас","role":"куратор внедрения","body":[{"h":"Что такое ЦКП","p":"Ценный конечный продукт — результат работы, который создаёт реальную ценность для клиента или бизнеса: проект сдан вовремя и в бюджете, клиент доволен, команда не выгорела, бизнес получил прибыль."},{"h":"Зачем","li":["Бизнесу — понимать, какую ценность создаёт каждый сотрудник и отдел, оценивать эффективность и планировать развитие","Менеджеру — видеть свой вклад в общий результат и понимать, какие навыки нужны, чтобы его производить"]},{"h":"Как связано с компетенциями и грейдами","p":"ЦКП задаёт функциональные обязанности, обязанности требуют компетенций. Отсюда карты компетенций по ролям и грейды: линейный менеджер, тимлид, руководитель отдела."},{"h":"Моя роль","p":"Методологию для отдела разрабатывал руководитель; я курировала внедрение: разбиралась, зачем это нужно, как должно выглядеть и как на основе ЦКП строить компетенции и грейды."}]},{"s":"bulkichvault","t":"bulkichVault","x":"Пет-проект на основе логики braindVault: личная система знаний для HR — кандидаты, встречи, проекты, аналитика. Одна из задач — этот сайт-резюме.","g":"Пет-проект","c":"Braind","r":"январь 2024 — сейчас"},{"s":"polnyy-cikl-nayma","t":"Полный цикл найма","x":"От запроса до адаптации, включая оффбординг. Подбор middle–lead: разработка, аналитика, дизайн, PR, HR. Воронка в Huntflow и работа с внешними рекрутерами.","g":"Найм","c":"Digital agency AIM","r":"август 2021 — декабрь 2023"},{"s":"ocenka-i-greydirovanie","t":"Оценка и грейдирование","x":"Первичная оценка soft/hard-компетенций, формат презентации кандидатов команде. Регулярная 360-оценка, сопровождение повышений.","g":"Оценка","c":"Digital agency AIM","r":"август 2021 — декабрь 2023"}   (function () {
    var p = new URLSearchParams(location.search).get('p');
    var cur = PROJECTS.filter(function (x) { return x.s === p; })[0];
    if (!cur) {
      document.getElementById('title').textContent = 'Проект не найден';
      document.getElementById('lead').innerHTML = 'Вернись к <a href="braind.html#experience">списку проектов</a>.';
      document.getElementById('more').parentNode.style.display = 'none';
      return;
    }
    document.title = cur.t + ' — Наталья Егурнова';
    document.getElementById('title').textContent = cur.t;
    document.getElementById('lead').textContent = cur.x;
    document.getElementById('body').innerHTML = (cur.body || []).map(function (sec) {
      var inner = sec.li
        ? '<ul>' + sec.li.map(function (item) { return '<li>' + item + '</li>'; }).join('') + '</ul>'
        : '<p>' + sec.p + '</p>';
      return '<section><h2>' + sec.h + '</h2>' + inner + '</section>';
    }).join('');
    var meta = [];
    if (cur.c) meta.push('<span>' + cur.c + '</span>');
    if (cur.r) meta.push('<span>' + cur.r + '</span>');
    if (cur.role) meta.push('<span>' + cur.role + '</span>');
    if (cur.g) meta.push('<span class="tag">' + cur.g + '</span>');
    document.getElementById('meta').innerHTML = meta.join('');
    var others = PROJECTS.filter(function (x) { return x.s !== cur.s && x.c === cur.c; }).slice(0, 6);
    document.getElementById('more').innerHTML = others.map(function (x) {
      return '<a href="project.html?p=' + x.s + '">' + x.t + '</a>';
    }).join('');
  })();
</script>
</body>
</html>
